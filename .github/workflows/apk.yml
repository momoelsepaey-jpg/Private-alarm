name: Build APK v2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android project
        run: |
          flutter create . --org com.example --project-name sunrise_smart_alarm --platforms android

      - name: Unpack project zip
        run: |
          z=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$z" ]; then echo "NO ZIP FOUND in repo root"; exit 1; fi
          rm -rf /tmp/src && mkdir /tmp/src
          unzip -q "$z" -d /tmp/src
          p=$(find /tmp/src -name pubspec.yaml | head -1)
          if [ -z "$p" ]; then echo "pubspec.yaml not found inside zip"; exit 1; fi
          d=$(dirname "$p")
          rm -rf lib test
          cp -rf "$d"/. .
          mkdir -p assets/sounds
          if [ ! -f assets/sounds/alarm.mp3 ]; then
