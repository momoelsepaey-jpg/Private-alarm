name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android project
        run: |
          flutter create . --org com.example --project-name sunrise_smart_alarm --platforms android
          rm -f test/widget_test.dart

      - name: Organize files
        run: |
          mkdir -p lib/core lib/captcha lib/services lib/ui test android_snippets assets/sounds
          rm -f /tmp/missing
          place() {
            f=$(find . -type f -name "$1" -not -path "./$2/*" -not -path "./android/*" -not -path "./.git/*" | head -1)
            if [ -n "$f" ]; then
              mv "$f" "$2/$1"
            elif [ ! -f "$2/$1" ]; then
              echo "MISSING: $1"; touch /tmp/missing
            fi
          }
          place main.dart lib
          for f in solar_calculator sunrise_modes smart_wake_planner sleep_stage_estimator; do place $f.dart lib/core; done
          for f in captchas tea_cup_recognizer; do place $f.dart lib/captcha; done
          for f in alarm_audio storage night_controller alarm_service sleep_tracker alarm_mode; do place $f.dart lib/services; done
          for f in home_page wake_screen; do place $f.dart lib/ui; done
          place core_test.dart test
          place alarm.mp3 assets/sounds
          place MainActivity.kt android_snippets
          grep -q AlarmService lib/main.dart || { echo "main.dart is not the project one"; touch /tmp/missing; }
          if [ -f /tmp/missing ]; then echo "Upload the missing files above"; exit 1; fi

      - name: Patch Android
        run: |
          python3 - <<'PY'
          import re, shutil, glob
          dst = 'android/app/src/main/kotlin/com/example/sunrise_smart_alarm/MainActivity.kt'
          shutil.copy('android_snippets/MainActivity.kt', dst)

          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ''.join(
              '    <uses-permission android:name="android.permission.%s"/>\n' % x for x in [
              'POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM',
              'USE_FULL_SCREEN_INTENT','WAKE_LOCK','RECEIVE_BOOT_COMPLETED','VIBRATE',
              'CAMERA','ACTIVITY_RECOGNITION','FOREGROUND_SERVICE',
              'FOREGROUND_SERVICE_SPECIAL_USE','ACCESS_COARSE_LOCATION','ACCESS_FINE_LOCATION'])
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('<activity', '<activity android:showWhenLocked="true" android:turnScreenOn="true"', 1)
          extra = '''
              <service android:name="dev.fluttercommunity.plus.androidalarmmanager.AlarmService"
                  android:permission="android.permission.BIND_JOB_SERVICE" android:exported="false"/>
              <receiver android:name="dev.fluttercommunity.plus.androidalarmmanager.AlarmBroadcastReceiver"
                  android:exported="false"/>
              <receiver android:name="dev.fluttercommunity.plus.androidalarmmanager.RebootBroadcastReceiver"
                  android:enabled="false" android:exported="false">
                <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
              </receiver>
              <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
                  android:foregroundServiceType="specialUse" android:exported="false"/>
          '''
          s = s.replace('</application>', extra + '</application>', 1)
          open(p, 'w', encoding='utf-8').write(s)

          g = glob.glob('android/app/build.gradle*')[0]
          t = open(g).read()
          t = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', t)
          t = re.sub(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', t, count=1)
          t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          open(g, 'w').write(t)
          PY

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sunrise-apk
          path: build/app/outputs/flutter-apk/app-release.apk
